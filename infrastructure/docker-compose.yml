version: '3.8'

services:
  # Eclipse Mosquitto MQTT Broker (Primary IoT telemetry path)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: prakop-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # PostgreSQL 16 with PostGIS (Primary Database)
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sajag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sajag_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis 7 (Caching, Queues, Pub/Sub)
  redis:
    image: redis:7-alpine
    container_name: sajag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data:
  redis_data:
