name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SAJAG_DEPLOY_SSH_KEY }}

      - name: Sync source to server
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 20.219.9.34 >> ~/.ssh/known_hosts
          rsync -az --delete \
            --exclude node_modules --exclude .git --exclude dist \
            --exclude .env --exclude '**/.env' \
            ./ azureuser@20.219.9.34:/var/www/sajag/backend/

      - name: Build and restart
        run: |
          ssh azureuser@20.219.9.34 '
            set -e
            cd /var/www/sajag/backend
            npm install --no-audit --no-fund
            npm run build:packages
            npm run db:generate --workspace=apps/api
            npm run db:push --workspace=apps/api
            npm run build --workspace=apps/api
            npm run build --workspace=apps/device-sim
            pm2 restart sajag-broker sajag-api sajag-sim --update-env
          '
